services:
  # ----------------------------------------------------------------------------
  # BANCO DE DADOS: PostgreSQL 16 + Extensão PostGIS
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: patinhas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-patinhas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-patinhas_secret_password}
      POSTGRES_DB: ${DB_NAME:-patinhas_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sh:/docker-entrypoint-initdb.d/init-postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-patinhas_user} -d ${DB_NAME:-patinhas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - patinhas_network

  # ----------------------------------------------------------------------------
  # CACHE & FILAS: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: patinhas_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - patinhas_network

  # ----------------------------------------------------------------------------
  # STORAGE S3 COMPATÍVEL: MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: patinhas_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-patinhas_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-patinhas_admin_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - patinhas_network

  # ----------------------------------------------------------------------------
  # E-MAIL LOCAL: Mailpit (Captura de SMTP para desenvolvimento)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: patinhas_mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - patinhas_network

  # ----------------------------------------------------------------------------
  # BACKEND: NestJS API
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: patinhas_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3333}:3333"
    environment:
      PORT: 3333
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-patinhas_user}:${DB_PASSWORD:-patinhas_secret_password}@postgres:5432/${DB_NAME:-patinhas_db}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-patinhas_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-patinhas_admin_secret}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-patinhas-media}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_access_key_change_in_production_min32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_key_change_in_production_min32chars}
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - patinhas_network

  # ----------------------------------------------------------------------------
  # FRONTEND: React + Vite (Mobile Shell 430px)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: patinhas_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      VITE_API_URL: http://localhost:3333/api/v1
      VITE_WS_URL: http://localhost:3333
      VITE_APP_NAME: "Patinhas"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/node_modules
    depends_on:
      - api
    networks:
      - patinhas_network

volumes:
  postgres_data:
    name: patinhas_postgres_data
  redis_data:
    name: patinhas_redis_data
  minio_data:
    name: patinhas_minio_data

networks:
  patinhas_network:
    name: patinhas_network
    driver: bridge